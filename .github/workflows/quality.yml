name: AURA quality checks

on:
  push:
    branches:
      - "development/**"
      - "feature/static-pages-deploy"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run smoke tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build static site
        run: npm run build:static
      - name: Verify static output
        run: test -f dist/index.html && test -f dist/aura-v5.html && test -f dist/assets/aura-001-origin.png && test -f dist/assets/aura-002-force.png
